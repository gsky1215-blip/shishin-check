<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>四神経営 実践セミナー FV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FDFCF9;font-family:"Noto Sans JP",sans-serif}

:root{
  --navy:#2C2C7E;
  --navy-soft:#5A5A9B;
  --orange:#DF6536;
  --paper:#FDFCF9;
}

.fv{position:relative;width:375px;height:812px;overflow:hidden;
    background:radial-gradient(120% 68% at 50% 26%, #FFFFFF 0%, #FDFCF9 46%, #F3F1EC 100%);
    font-family:"Noto Serif JP",serif;color:var(--navy)}

/* ---- 円環：四神が巡る ---- */
.orbit{position:absolute;top:40px;left:50%;width:232px;height:232px;margin-left:-116px;
       animation:spin 72s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.orbit__ring{position:absolute;inset:0;border-radius:50%;
             border:1px solid rgba(90,90,155,.20)}
.orbit__ring--in{inset:26px;border-color:rgba(223,101,54,.16)}

.god{position:absolute;width:80px;height:80px;margin:-40px 0 0 -40px;
     animation:counter 72s linear infinite}
@keyframes counter{to{transform:rotate(-360deg)}}
.god img{width:100%;height:100%;object-fit:contain;
         filter:saturate(.92) contrast(1.04)}
.god--1{top:0;left:50%}
.god--2{top:50%;left:100%}
.god--3{top:100%;left:50%}
.god--4{top:50%;left:0}

/* 光が4神を順に巡る */
.glow{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;
      background:radial-gradient(circle, rgba(223,101,54,.30) 0%, rgba(223,101,54,0) 68%);
      opacity:0}
.glow--1{top:0;left:50%;animation:pulse 8s ease-in-out infinite 0s}
.glow--2{top:50%;left:100%;animation:pulse 8s ease-in-out infinite 2s}
.glow--3{top:100%;left:50%;animation:pulse 8s ease-in-out infinite 4s}
.glow--4{top:50%;left:0;animation:pulse 8s ease-in-out infinite 6s}
@keyframes pulse{0%,72%,100%{opacity:0;transform:scale(.86)}12%,30%{opacity:1;transform:scale(1)}}

/* 円環を巡る光の点 */
.spark{position:absolute;top:40px;left:50%;width:232px;height:232px;margin-left:-116px;
       animation:spin 8s linear infinite}
.spark::before{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;
       border-radius:50%;background:var(--orange);
       box-shadow:0 0 12px 3px rgba(223,101,54,.45)}

/* 白のかぶせ（下半分を落ち着かせる） */
.veil{position:absolute;left:0;right:0;top:250px;height:110px;
      background:linear-gradient(180deg,rgba(253,252,249,0) 0%,#FDFCF9 62%,#FDFCF9 100%)}

/* ---- 文字 ---- */
.body{position:absolute;left:30px;top:318px;width:300px}
.lead{font-size:15px;line-height:2.1;letter-spacing:.04em;font-weight:400;color:var(--navy-soft);
      opacity:0;animation:up .9s ease-out .25s forwards}
.lead .hl{color:var(--navy);font-weight:500}
.rule{width:32px;height:1px;background:var(--orange);margin:20px 0 20px;
      transform-origin:left;transform:scaleX(0);animation:draw .7s ease-out 1s forwards}
.big{font-size:46px;line-height:1.32;letter-spacing:.02em;font-weight:500;
     opacity:0;animation:up 1s ease-out 1.15s forwards}
.big .q{color:var(--orange);font-weight:600}
.big .sm{font-size:33px}
.sub{margin-top:28px;width:250px;font-family:"Noto Sans JP",sans-serif;font-size:11.5px;
     line-height:2.1;letter-spacing:.02em;color:#4A4A6E;
     opacity:0;animation:up .9s ease-out 1.7s forwards}
.sub b{font-weight:500;color:var(--orange)}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{transform:scaleX(1)}}

/* ---- 下部 ---- */
.foot{position:absolute;left:30px;top:614px;opacity:0;animation:up .9s ease-out 2.1s forwards}
.foot__name{font-size:19px;letter-spacing:.1em;font-weight:500}
.foot__date{margin-top:9px;font-family:"Montserrat",sans-serif;font-size:27px;letter-spacing:.01em;
            font-weight:400;line-height:1}
.foot__date span{font-size:12px;margin-left:6px;color:var(--navy-soft)}
.foot__meta{margin-top:8px;font-family:"Montserrat",sans-serif;font-size:9px;
            letter-spacing:.16em;color:var(--navy-soft)}

.cta{position:absolute;left:30px;right:30px;bottom:42px;height:54px;background:var(--orange);
     border-radius:27px;display:flex;align-items:center;justify-content:center;
     font-family:"Noto Sans JP",sans-serif;font-size:15px;font-weight:500;color:#fff;
     letter-spacing:.06em;text-decoration:none;
     box-shadow:0 6px 18px rgba(223,101,54,.28);
     opacity:0;animation:up .9s ease-out 2.4s forwards}
.cta::after{content:"";width:6px;height:6px;border-top:1.4px solid #fff;border-right:1.4px solid #fff;
     transform:rotate(45deg);margin-left:12px;margin-top:-1px}

@media (prefers-reduced-motion: reduce){
  .orbit,.spark,.god{animation:none}
  .lead,.big,.sub,.foot,.cta{opacity:1;animation:none}
  .rule{transform:scaleX(1);animation:none}
  .glow{animation:none;opacity:.5}
}
</style>
</head>
<body>

<div class="fv">
  <div class="orbit">
    <div class="orbit__ring"></div>
    <div class="orbit__ring orbit__ring--in"></div>
    <div class="glow glow--1"></div>
    <div class="glow glow--2"></div>
    <div class="glow glow--3"></div>
    <div class="glow glow--4"></div>
    <div class="god god--1"><img src="img/g_seiryu.png" alt=""></div>
    <div class="god god--2"><img src="img/g_suzaku.png" alt=""></div>
    <div class="god god--3"><img src="img/g_byakko.png" alt=""></div>
    <div class="god god--4"><img src="img/g_genbu.png" alt=""></div>
  </div>
  <div class="spark"></div>
  <div class="veil"></div>

  <div class="body">
    <p class="lead">一時的に<span class="hl">伸びる</span>会社と、<br>業績を<span class="hl">上げ続ける</span>会社。</p>
    <div class="rule"></div>
    <p class="big">違いは<br><span class="q">「組織」</span><br><span class="sm">にある。</span></p>
  </div>

  <div class="foot">
    <p class="foot__name">四神経営　実践セミナー</p>
    <p class="foot__date">2026.00.00<span>[Thu]</span></p>
    <p class="foot__meta">ONLINE SEMINAR / 90 MIN.</p>
  </div>

  <a class="cta" href="#">セミナーに参加する</a>
</div>

</body>
</html>
